<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan & Antrean Kantin (Siswa)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #2563eb 100%);
      min-height: 100vh;
      color: #1e293b;
      padding: clamp(12px, 3vw, 28px);
    }
    .wrap { max-width: 960px; width: 100%; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.14); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white; padding: 16px 20px; border-radius: 16px; margin-bottom: 16px;
    }
    .header strong { font-size: clamp(18px, 2.5vw, 22px); }
    .header a { color: white; text-decoration: none; background: rgba(0, 0, 0, 0.25); padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: bold; }
    .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
    .card { background: #ffffff; padding: 18px; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    h3 { font-size: 16px; margin-bottom: 12px; color: #1e3a8a; border-bottom: 2px solid #eff6ff; padding-bottom: 8px; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .btn-pilih { padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #f8fafc; text-align: left; cursor: pointer; font-size: 14px; }
    .btn-pilih:active { background: #dbeafe; border-color: #2563eb; }
    .btn-pilih:disabled { background: #fee2e2; border-color: #fca5a5; opacity: 0.7; cursor: not-allowed; }
    .keranjang-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
    .keranjang-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #bfdbfe; }
    .btn-kurang { background: #dc2626; color: white; border: none; border-radius: 6px; padding: 4px 9px; font-weight: bold; cursor: pointer; margin-left: 6px; }
    .btn-pesan { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 8px; }
    .btn-batal { width: 100%; padding: 11px; background: #e2e8f0; color: #334155; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .item-antrean { padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 10px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
    .dimasak { background: #fef3c7; color: #b45309; }
    .siap { background: #dcfce7; color: #15803d; }
  </style>
</head>
  
<body>
<div class="wrap">
  <div class="header">
    <strong>🍱 Pesan & Antrean Kantin</strong>
    <a href="index.html">← Menu</a>
  </div>
<div class="grid-layout">
  <div class="card">
    <h3>✍️ Pilih Menu & Form Pemesanan Siswa</h3>
    <input type="text" id="namaSiswa" placeholder="Nama & Kelas (Contoh: Ikhsan - XII RPL 1)">

    <p style="font-size:12px; color:#64748b; margin-bottom:6px;">Klik menu langsung (bisa klik berkali-kali untuk tambah jumlah):</p>
    <div class="grid-menu" id="gridMenuSiswa"></div>

    <div class="keranjang-box">
      <strong>🛒 Daftar Pesanan Sementara:</strong>
      <div id="listKeranjangSiswa" style="margin:6px 0; color:#475569;">Belum ada menu dipilih.</div>
      <div style="font-weight:bold; font-size:14px; color:#1d4ed8; margin-top:6px;">
        Total Bayar: Rp <span id="totalPesananSiswa">0</span>
      </div>
    </div>

    <button type="button" class="btn-pesan" onclick="kirimPesanan()">✓ PESAN SEKARANG & AMBIL ANTREAN</button>
    <button type="button" class="btn-batal" onclick="batalPesanan()">✕ Batalkan / Ganti Menu</button>
  </div>

  <div class="card">
    <h3>👀 Monitor Status Antrean</h3>
    <p style="font-size:12px; color:#64748b; margin-bottom:8px;">Status pesanan hanya dapat diubah oleh Bu Rina di aplikasi kasir.</p>
    <div id="monitorAntrean"></div>
  </div>
</div>
</div>

<script>
  const defaultMenu = [
    { id: 1, nama: 'Nasi Goreng', harga: 10000, stok: 10 },
    { id: 2, nama: 'Mie Ayam', harga: 10000, stok: 8 },
    { id: 3, nama: 'Nasi Uduk', harga: 8000, stok: 5 },
    { id: 4, nama: 'Gorengan (3bj)', harga: 3000, stok: 15 },
    { id: 5, nama: 'Es Teh Manis', harga: 3000, stok: 20 },
    { id: 6, nama: 'Air Mineral', harga: 3000, stok: 0 }
  ];

  let menuKantin = JSON.parse(localStorage.getItem('kantin_menu_data')) || defaultMenu;
  let antrean = JSON.parse(localStorage.getItem('kantin_orders_data')) || [];
  let noUrut = Number(localStorage.getItem('kantin_no_urut')) || 1;
  let keranjangSiswa = [];

  function renderHalaman() {
    menuKantin = JSON.parse(localStorage.getItem('kantin_menu_data')) || defaultMenu;
    antrean = JSON.parse(localStorage.getItem('kantin_orders_data')) || [];

    document.getElementById('gridMenuSiswa').innerHTML = menuKantin.map(m => {
      let diKeranjang = keranjangSiswa.find(k => k.id === m.id);
      let sisaStok = m.stok - (diKeranjang ? diKeranjang.qty : 0);
      return `
        <button type="button" class="btn-pilih" ${sisaStok <= 0 ? 'disabled' : ''} onclick="tambahMenuSiswa(${m.id})">
          <strong>${m.nama}</strong><br>
          <small>Rp ${m.harga.toLocaleString('id-ID')}</small><br>
          <span style="font-size:11px; font-weight:bold; color:${sisaStok > 0 ? '#16a34a' : '#dc2626'};">
            ${sisaStok > 0 ? 'Tersedia (' + sisaStok + ')' : 'Tak Tersedia'}
          </span>
        </button>
      `;
    }).join('');

    const boxKeranjang = document.getElementById('listKeranjangSiswa');
    let total = 0;
    if (keranjangSiswa.length === 0) {
      boxKeranjang.innerHTML = 'Belum ada menu dipilih.';
    } else {
      boxKeranjang.innerHTML = keranjangSiswa.map(k => {
        total += k.harga * k.qty;
        return `
          <div class="keranjang-row">
            <span>${k.nama} <b>x${k.qty}</b></span>
            <span>Rp ${(k.harga * k.qty).toLocaleString('id-ID')} <button type="button" class="btn-kurang" onclick="kurangMenuSiswa(${k.id})">-</button></span>
          </div>
        `;
      }).join('');
    }
    document.getElementById('totalPesananSiswa').innerText = total.toLocaleString('id-ID');

    document.getElementById('monitorAntrean').innerHTML = antrean.length
      ? antrean.map(a => `
        <div class="item-antrean">
          <div>
            <strong>[${a.kode}] ${a.siswa}</strong><br>
            <small>${a.item}</small><br>
            <small style="color:#2563eb; font-weight:bold;">Total: Rp ${a.harga.toLocaleString('id-ID')}</small>
          </div>
          <span class="badge ${a.status === 'Siap Diambil' ? 'siap' : 'dimasak'}">${a.status}</span>
        </div>
      `).join('')
      : '<small style="color:#64748b;">Belum ada antrean aktif.</small>';
  }

  function tambahMenuSiswa(id) {
    let m = menuKantin.find(x => x.id === id);
    let ada = keranjangSiswa.find(k => k.id === id);
    let qtySaatIni = ada ? ada.qty : 0;
    if (!m || qtySaatIni >= m.stok) return alert('Stok tidak mencukupi!');

    ada ? ada.qty++ : keranjangSiswa.push({ id: m.id, nama: m.nama, harga: m.harga, qty: 1 });
    renderHalaman();
  }

  function kurangMenuSiswa(id) {
    let idx = keranjangSiswa.findIndex(k => k.id === id);
    if (idx > -1) {
      keranjangSiswa[idx].qty > 1 ? keranjangSiswa[idx].qty-- : keranjangSiswa.splice(idx, 1);
      renderHalaman();
    }
  }

  function batalPesanan() {
    keranjangSiswa = [];
    renderHalaman();
  }

  function kirimPesanan() {
    let siswa = document.getElementById('namaSiswa').value.trim();
    if (!siswa) return alert('Isi nama dan kelas terlebih dahulu!');
    if (keranjangSiswa.length === 0) return alert('Pilih minimal satu makanan atau minuman!');

    let ringkasanItem = [];
    let totalHarga = 0;

    keranjangSiswa.forEach(k => {
      let m = menuKantin.find(x => x.id === k.id);
      if (m) m.stok = Math.max(0, m.stok - k.qty);
      ringkasanItem.push(`${k.nama} (${k.qty})`);
      totalHarga += k.harga * k.qty;
    });

    let kode = 'A-' + String(noUrut++).padStart(2, '0');
    antrean.push({
      id: Date.now(),
      kode: kode,
      siswa: siswa,
      item: ringkasanItem.join(', '),
      harga: totalHarga,
      status: 'Dimasak'
    });

    localStorage.setItem('kantin_menu_data', JSON.stringify(menuKantin));
    localStorage.setItem('kantin_orders_data', JSON.stringify(antrean));
    localStorage.setItem('kantin_no_urut', noUrut);

    keranjangSiswa = [];
    document.getElementById('namaSiswa').value = '';
    renderHalaman();
    alert('Pesanan terkirim ke Bu Rina!\nNomor Antrean Anda: ' + kode + '\nTotal: Rp ' + totalHarga.toLocaleString('id-ID'));
  }

  renderHalaman();
</script>
</body>
</html>
