<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan & Antrean Kantin (Siswa)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f1f5f9; color: #1e293b; padding: 12px; }
    .wrap { max-width: 500px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #2563eb; color: white; padding: 12px 15px; border-radius: 10px; margin-bottom: 12px; }
    .header a { color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 6px; font-size: 13px; }
    .card { background: white; padding: 14px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    h3 { font-size: 15px; margin-bottom: 10px; color: #0f172a; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
    input, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .btn-pesan { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .stok-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 4px; font-size: 12px; }
    .stok-item { padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; background: #f8fafc; }
    .item-antrean { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 8px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .dimasak { background: #fef3c7; color: #b45309; }
    .siap { background: #dcfce7; color: #15803d; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <strong>🍱 Pesan & Antrean Kantin</strong>
    <a href="index.html">← Menu</a>
  </div>

  <div class="card">
    <h3>1. Cek Ketersediaan Menu Hari Ini</h3>
    <div class="stok-list" id="infoStok"></div>
  </div>

  <div class="card">
    <h3>2. Form Pemesanan Siswa</h3>
    <input type="text" id="namaSiswa" placeholder="Nama & Kelas (Contoh: Ikhsan - XII RPL 1)">
    <select id="pilihMenu"></select>
    <button class="btn-pesan" onclick="kirimPesanan()">+ PESAN & AMBIL ANTREAN</button>
  </div>

  <div class="card">
    <h3>3. Monitor Status Antrean (Hanya Lihat)</h3>
    <p style="font-size:12px; color:#64748b; margin-bottom:8px;">Status pesanan hanya dapat diubah oleh Bu Rina di aplikasi kasir.</p>
    <div id="monitorAntrean"></div>
  </div>
</div>

<script>
  const defaultMenu = [
    { id: 1, nama: 'Nasi Goreng', harga: 10000, stok: 10 },
    { id: 2, nama: 'Mie Ayam', harga: 10000, stok: 8 },
    { id: 3, nama: 'Nasi Uduk', harga: 8000, stok: 5 },
    { id: 4, nama: 'Gorengan (3bj)', harga: 3000, stok: 15 },
    { id: 5, nama: 'Es Teh Manis', harga: 3000, stok: 20 },
    { id: 6, nama: 'Air Mineral', harga: 3000, stok: 0 }
  ];

  let menuKantin = JSON.parse(localStorage.getItem('kantin_menu_data')) || defaultMenu;
  let antrean = JSON.parse(localStorage.getItem('kantin_orders_data')) || [];
  let noUrut = Number(localStorage.getItem('kantin_no_urut')) || 1;

  function renderHalaman() {
    menuKantin = JSON.parse(localStorage.getItem('kantin_menu_data')) || defaultMenu;
    antrean = JSON.parse(localStorage.getItem('kantin_orders_data')) || [];

    document.getElementById('infoStok').innerHTML = menuKantin.map(m => `
      <div class="stok-item">
        <strong>${m.nama}</strong><br>
        <span style="color:${m.stok > 0 ? '#16a34a' : '#dc2626'}; font-weight:bold;">
          ${m.stok > 0 ? 'Tersedia (' + m.stok + ')' : 'Tak Tersedia'}
        </span>
      </div>
    `).join('');

    let tersedia = menuKantin.filter(m => m.stok > 0);
    document.getElementById('pilihMenu').innerHTML = tersedia.length
      ? tersedia.map(m => `<option value="${m.id}">${m.nama} - Rp ${m.harga.toLocaleString('id-ID')}</option>`).join('')
      : '<option value="">Semua menu sedang tak tersedia</option>';

    document.getElementById('monitorAntrean').innerHTML = antrean.length
      ? antrean.map(a => `
        <div class="item-antrean">
          <div>
            <strong>[${a.kode}] ${a.siswa}</strong><br>
            <small>${a.item}</small>
          </div>
          <span class="badge ${a.status === 'Siap Diambil' ? 'siap' : 'dimasak'}">${a.status}</span>
        </div>
      `).join('')
      : '<small style="color:#64748b;">Belum ada antrean aktif.</small>';
  }

  function kirimPesanan() {
    let siswa = document.getElementById('namaSiswa').value.trim();
    let menuId = Number(document.getElementById('pilihMenu').value);
    if (!siswa) return alert('Isi nama dan kelas terlebih dahulu!');
    if (!menuId) return alert('Menu sedang tak tersedia!');

    let m = menuKantin.find(x => x.id === menuId);
    if (!m || m.stok <= 0) return alert('Maaf, stok baru saja habis!');

    m.stok -= 1;
    let kode = 'A-' + String(noUrut++).padStart(2, '0');
    antrean.push({ id: Date.now(), kode, siswa, item: m.nama, harga: m.harga, status: 'Dimasak' });

    localStorage.setItem('kantin_menu_data', JSON.stringify(menuKantin));
    localStorage.setItem('kantin_orders_data', JSON.stringify(antrean));
    localStorage.setItem('kantin_no_urut', noUrut);

    document.getElementById('namaSiswa').value = '';
    renderHalaman();
    alert('Pesanan terkirim ke Bu Rina!\nNomor Antrean Anda: ' + kode);
  }

  renderHalaman();
</script>
</body>
</html>
