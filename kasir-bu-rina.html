<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Kantin Bu Rina</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #15803d 100%);
      min-height: 100vh;
      color: #1e293b;
      padding: clamp(12px, 3vw, 28px);
    }
    .wrap { max-width: 960px; width: 100%; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.14); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white; padding: 16px 20px; border-radius: 16px; margin-bottom: 16px;
    }
    .header strong { font-size: clamp(18px, 2.5vw, 22px); }
    .header a { color: white; text-decoration: none; background: rgba(0, 0, 0, 0.25); padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: bold; }
    .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; background: rgba(255, 255, 255, 0.2); color: white; }
    .tab-btn.active { background: #ffffff; color: #065f46; box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
    .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
    .card { background: #ffffff; padding: 18px; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    h3 { font-size: 16px; margin-bottom: 12px; color: #064e3b; border-bottom: 2px solid #ecfdf5; padding-bottom: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-menu { padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #f8fafc; text-align: left; cursor: pointer; font-size: 14px; }
    .btn-menu:active { background: #dcfce7; border-color: #16a34a; }
    .btn-menu:disabled { background: #fee2e2; border-color: #fca5a5; opacity: 0.75; cursor: not-allowed; }
    .habis { color: #dc2626; font-size: 12px; font-weight: bold; }
    .ada { color: #16a34a; font-size: 12px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
    td, th { padding: 8px 4px; border-bottom: 1px solid #f1f5f9; text-align: left; }
    input[type=number] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin: 10px 0; font-size: 16px; }
    .btn-full { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-green { background: #16a34a; color: white; }
    .btn-gray { background: #e2e8f0; color: #334155; }
    .order-box { border: 1px solid #cbd5e1; padding: 12px; border-radius: 10px; margin-bottom: 10px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
    .btn-sm { padding: 8px 12px; border: none; border-radius: 8px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; margin-left: 4px; }
    .stok-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <strong>🧾 Kasir & Dapur Bu Rina</strong>
    <a href="index.html">← Menu</a>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="btnTab1" onclick="bukaTab(1)">1. Melayani & Pesanan</button>
    <button class="tab-btn" id="btnTab2" onclick="bukaTab(2)">2. Kelola Stok Barang</button>
  </div>

  <!-- TAB 1: MELAYANI -->
  <div id="tab1">
    <div class="grid-layout">
      <div>
        <div class="card">
          <h3>📩 Pesanan Masuk dari Siswa (Antrean)</h3>
          <div id="listAntrean"></div>
        </div>
        <div class="card" style="background:#ecfdf5; border:1px solid #a7f3d0;">
          <strong style="font-size:17px; color:#065f46;">💰 Total Omzet Hari Ini: Rp <span id="omzet">0</span></strong>
        </div>
      </div>

    <div class="card">
      <h3>🛒 Kasir Pembelian Langsung</h3>
      <div class="grid" id="gridMenu"></div>
      <table>
        <thead><tr><th>Menu</th><th>Qty</th><th>Subtotal</th></tr></thead>
        <tbody id="tabelKasir"></tbody>
      </table>
      <div style="font-weight:bold; font-size:16px; margin-top:6px;">Total: Rp <span id="totalBayar">0</span></div>
      <input type="number" id="uangSiswa" placeholder="Uang tunai pembeli (Rp)" oninput="hitungKembali()">
      <div style="font-weight:bold; color:#16a34a;">Kembalian: Rp <span id="kembalian">0</span></div>
      <button class="btn-full btn-green" onclick="bayarLangsung()">✓ SELESAIKAN & POTONG STOK</button>
      <button class="btn-full btn-gray" onclick="resetKasir()">↺ Ulangi</button>
      </div>
    </div>
  </div>

  <!-- TAB 2: KELOLA STOK -->
  <div id="tab2" class="hidden">
    <div class="card">
      <h3>📦 Atur & Restock Dagangan Kantin</h3>
      <p style="font-size:12px; color:#64748b; margin-bottom:10px;">Jika stok 0, menu otomatis berstatus <b>Tak Tersedia</b> di halaman siswa.</p>
      <div id="listStok"></div>
    </div>
  </div>
</div>

<script>
  const defaultMenu = [
    { id: 1, nama: 'Nasi Goreng', harga: 10000, stok: 10 },
    { id: 2, nama: 'Mie Ayam', harga: 10000, stok: 8 },
    { id: 3, nama: 'Nasi Uduk', harga: 8000, stok: 5 },
    { id: 4, nama: 'Gorengan (3bj)', harga: 3000, stok: 15 },
    { id: 5, nama: 'Es Teh Manis', harga: 3000, stok: 20 },
    { id: 6, nama: 'Air Mineral', harga: 3000, stok: 0 }
  ];

  let menuKantin = JSON.parse(localStorage.getItem('kantin_menu_data')) || defaultMenu;
  let antrean = JSON.parse(localStorage.getItem('kantin_orders_data')) || [];
  let omzet = Number(localStorage.getItem('kantin_omzet_data')) || 0;
  let keranjang = [];

  function simpanData() {
    localStorage.setItem('kantin_menu_data', JSON.stringify(menuKantin));
    localStorage.setItem('kantin_orders_data', JSON.stringify(antrean));
    localStorage.setItem('kantin_omzet_data', omzet);
  }

  function bukaTab(no) {
    document.getElementById('tab1').className = no === 1 ? '' : 'hidden';
    document.getElementById('tab2').className = no === 2 ? '' : 'hidden';
    document.getElementById('btnTab1').className = no === 1 ? 'tab-btn active' : 'tab-btn';
    document.getElementById('btnTab2').className = no === 2 ? 'tab-btn active' : 'tab-btn';
    renderSemua();
  }

  function renderSemua() {
    document.getElementById('omzet').innerText = omzet.toLocaleString('id-ID');

    document.getElementById('gridMenu').innerHTML = menuKantin.map(m => `
      <button class="btn-menu" ${m.stok <= 0 ? 'disabled' : ''} onclick="tambahKeranjang(${m.id})">
        <strong>${m.nama}</strong><br>
        <small>Rp ${m.harga.toLocaleString('id-ID')}</small><br>
        <span class="${m.stok > 0 ? 'ada' : 'habis'}">${m.stok > 0 ? 'Stok: ' + m.stok : 'Tak Tersedia'}</span>
      </button>
    `).join('');

    const boxAntrean = document.getElementById('listAntrean');
    boxAntrean.innerHTML = antrean.length ? antrean.map(a => `
      <div class="order-box">
        <div>
          <strong>[${a.kode}] ${a.siswa}</strong><br>
          <small>${a.item} (Rp ${a.harga.toLocaleString('id-ID')})</small><br>
          <span style="font-size:11px; font-weight:bold; color:${a.status === 'Siap Diambil' ? '#16a34a' : '#d97706'};">Status: ${a.status}</span>
        </div>
        <div>
          ${a.status === 'Dimasak' ? `<button class="btn-sm" style="background:#2563eb;" onclick="ubahSiap(${a.id})">Siap</button>` : ''}
          <button class="btn-sm" style="background:#16a34a;" onclick="selesaiAntrean(${a.id})">Selesai</button>
        </div>
      </div>
    `).join('') : '<small style="color:#64748b;">Belum ada pesanan dari siswa.</small>';

    document.getElementById('listStok').innerHTML = menuKantin.map(m => `
      <div class="stok-row">
        <div>
          <strong>${m.nama}</strong> <small>(Rp ${m.harga.toLocaleString('id-ID')})</small><br>
          <span class="${m.stok > 0 ? 'ada' : 'habis'}">${m.stok > 0 ? 'Tersedia: ' + m.stok : 'Tak Tersedia (0)'}</span>
        </div>
        <div>
          <button class="btn-sm" style="background:#dc2626;" onclick="ubahStok(${m.id}, -1)">-1</button>
          <button class="btn-sm" style="background:#16a34a;" onclick="ubahStok(${m.id}, 5)">+5</button>
          <button class="btn-sm" style="background:#64748b;" onclick="habiskanStok(${m.id})">Habis</button>
        </div>
      </div>
    `).join('');
  }

  function ubahStok(id, jml) {
    let m = menuKantin.find(x => x.id === id);
    if (m) { m.stok = Math.max(0, m.stok + jml); simpanData(); renderSemua(); }
  }

  function habiskanStok(id) {
    let m = menuKantin.find(x => x.id === id);
    if (m) { m.stok = 0; simpanData(); renderSemua(); }
  }

  function ubahSiap(id) {
    let a = antrean.find(x => x.id === id);
    if (a) { a.status = 'Siap Diambil'; simpanData(); renderSemua(); }
  }

  function selesaiAntrean(id) {
    let idx = antrean.findIndex(x => x.id === id);
    if (idx > -1) {
      omzet += antrean[idx].harga;
      antrean.splice(idx, 1);
      simpanData(); renderSemua();
      alert('Pesanan selesai & omzet ditambahkan!');
    }
  }

  function tambahKeranjang(id) {
    let m = menuKantin.find(x => x.id === id);
    let ada = keranjang.find(k => k.id === id);
    let qtyDiKeranjang = ada ? ada.qty : 0;
    if (qtyDiKeranjang >= m.stok) return alert('Stok tidak mencukupi!');
    ada ? ada.qty++ : keranjang.push({ id: m.id, nama: m.nama, harga: m.harga, qty: 1 });
    renderKeranjang();
  }

  function renderKeranjang() {
    let tot = 0;
    document.getElementById('tabelKasir').innerHTML = keranjang.map(k => {
      tot += k.harga * k.qty;
      return `<tr><td>${k.nama}</td><td>${k.qty}</td><td>Rp ${(k.harga * k.qty).toLocaleString('id-ID')}</td></tr>`;
    }).join('');
    document.getElementById('totalBayar').innerText = tot.toLocaleString('id-ID');
    hitungKembali();
  }

    function hitungKembali() {
    let tot = keranjang.reduce((s, k) => s + k.harga * k.qty, 0);
    let byr = Number(document.getElementById('uangSiswa').value) || 0;
    document.getElementById('kembalian').innerText = byr >= tot ? (byr - tot).toLocaleString('id-ID') : 'Kurang';
  }

  function bayarLangsung() {
    let tot = keranjang.reduce((s, k) => s + k.harga * k.qty, 0);
    let byr = Number(document.getElementById('uangSiswa').value) || 0;
    if (!tot || byr < tot) return alert('Cek daftar belanja atau uang tunai!');

    keranjang.forEach(k => {
      let m = menuKantin.find(x => x.id === k.id);
      if (m) m.stok = Math.max(0, m.stok - k.qty);
    });
    omzet += tot;
    simpanData();
    alert('Transaksi Berhasil! Kembalian: Rp ' + (byr - tot).toLocaleString('id-ID'));
    resetKasir();
    renderSemua();
  }

  function resetKasir() {
    keranjang = [];
    document.getElementById('uangSiswa').value = '';
    renderKeranjang();
  }

  simpanData();
  renderSemua();
  
</script>
</body>
</html>
